[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vinted-assistant"
version = "0.1.0"
description = "Assistant IA pour créer des annonces Vinted à partir de photos, connecté à votre navigateur."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.70.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vinted-assistant = "vinted_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["vinted_assistant*"]

[tool.setuptools.package-data]
vinted_assistant = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
